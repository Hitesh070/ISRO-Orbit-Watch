name: Refresh Indian orbital catalog
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: india-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/refresh_india_catalog.py
      - name: Commit refreshed public catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/catalog.json frontend/public/data/meta.json frontend/public/data/satcat-india.json
          git diff --cached --quiet || git commit -m "Refresh Indian orbital catalog"
          git push origin main

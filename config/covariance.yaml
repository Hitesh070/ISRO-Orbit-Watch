# ==============================================================================
# OrbitGuard Conjunction & Covariance Configuration (Phase 3)
# ==============================================================================
# IMPORTANT SCIENTIFIC NOTICE:
# Publicly available Two-Line Element sets (TLEs) and General Perturbations (GP)
# data DO NOT contain covariance error matrices.
# The covariance models below are SYNTHETIC SCREENING-GRADE ASSUMPTIONS calibrated
# to typical SGP4 error growth curves (e.g., Vallado & Kelso 2013).
# They are intended for research, education, and screening prioritization ONLY.
# Operational collision avoidance maneuvers (CAM) require official Conjunction
# Data Messages (CDMs) derived from high-precision numerical orbit determination
# with sensor-calibrated covariance.
# ==============================================================================

version: "3.0.0"
provider: "SyntheticRTN"

synthetic_rtn:
  # Initial 1-sigma positional uncertainty at TLE epoch (km)
  # In RTN frame: R = Radial, T = Transverse (Along-Track), N = Normal (Cross-Track)
  initial_sigma_km:
    radial: 0.100       # 100 meters
    transverse: 0.800   # 800 meters (along-track uncertainty dominates)
    normal: 0.150       # 150 meters

  # Growth rate of 1-sigma uncertainty per day of element-set age (km / day^power)
  growth_rate_per_day:
    radial: 0.050       # ~50 meters / day
    transverse: 0.750   # Along-track growth due to atmospheric drag & B* uncertainty
    normal: 0.060       # ~60 meters / day

  # Exponent for along-track secular error growth (typically 1.0 to 1.5 for LEO drag)
  along_track_age_exponent: 1.25

  # Minimum covariance diagonal floor to avoid numerical singularity (km^2)
  variance_floor_km2: 1.0e-6

hard_body_radius:
  # Default physical radius assumptions where RCS data is unavailable (km)
  default_payload_radius_km: 0.0075    # 7.5 meters (large bus / solar arrays)
  default_debris_radius_km: 0.0020     # 2.0 meters (fragment / small body)
  default_rocket_body_radius_km: 0.012 # 12.0 meters (spent upper stage)

  # RCS category mapping to approximate equivalent spherical radius (m -> km)
  rcs_mapping_km:
    LARGE: 0.0080   # > 1 m^2
    MEDIUM: 0.0025  # 0.1 - 1.0 m^2
    SMALL: 0.0008   # < 0.1 m^2

screening_thresholds:
  # Miss distance thresholds (km)
  max_screening_miss_distance_km: 25.0
  close_approach_threshold_km: 5.0
  critical_distance_threshold_km: 1.0

  # Collision Probability (Pc) industry screening levels (Foster-1992 2-D integral)
  # Standard space agency advisory threshold ~ 1e-4 down to 1e-7
  pc_levels:
    nominal_green: 1.0e-7       # Below 1 in 10,000,000
    caution_yellow: 1.0e-4      # 1 in 10,000,000 to 1 in 10,000
    critical_red: 1.0e-4        # Above 1 in 10,000 (standard action threshold)

  # Relative velocity threshold for co-orbital classification (km/s)
  # Pairs in same cluster or constellation with v_rel below this are labeled "CO-ORBITAL"
  co_orbital_rel_velocity_kms: 0.080  # 80 m/s
